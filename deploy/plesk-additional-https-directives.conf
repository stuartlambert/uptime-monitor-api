ProxyPreserveHost On
ProxyPass        /api/ http://127.0.0.1:8080/api/
ProxyPassReverse /api/ http://127.0.0.1:8080/api/
ProxyPass        /sites http://127.0.0.1:8080/sites
ProxyPassReverse /sites http://127.0.0.1:8080/sites
ProxyPass        /health http://127.0.0.1:8080/health
ProxyPassReverse /health http://127.0.0.1:8080/health
RequestHeader set X-Forwarded-Proto "https"
ProxyTimeout 45

<Directory "/var/www/vhosts/monitor.pinkcrab.co.uk/httpdocs">
    FallbackResource /index.html
</Directory>

Header always set Cache-Control "no-cache, must-revalidate"
<LocationMatch "^/assets/">
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<LocationMatch "^/(api|sites|health)">
    Header always set Cache-Control "no-store"
</LocationMatch>

Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "DENY"

<IfModule mod_remoteip.c>
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32
    RemoteIPTrustedProxy 2405:b500::/32 2405:8100::/32 2a06:98c0::/29
    RemoteIPTrustedProxy 2c0f:f248::/32
</IfModule>
