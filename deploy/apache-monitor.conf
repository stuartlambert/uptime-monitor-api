# Apache vhost for uptime-monitor: admin UI at /, REST API at /api/.
#
# Both are served from ONE hostname on the 443 this server already runs. That is
# deliberate: a shared origin means the session cookie works with SameSite=Lax,
# and there is no CORS configuration anywhere in the stack.
#
#   browser ──TLS──▶ Cloudflare ──TLS──▶ Apache :443 ──┬─▶ /var/www/monitor-ui  (static SPA)
#                                                      └─▶ 127.0.0.1:8080       (/api/)
#
# Required modules — enable before loading this file, or Apache returns 500 with
# "no protocol handler" (mod_proxy_http is the one people forget):
#
#   sudo a2enmod proxy proxy_http ssl headers expires
#
# ON PLESK: do not use this file at all — use
# deploy/plesk-additional-https-directives.conf instead.
#
# Plesk owns the vhost and regenerates it, so this file would be discarded. The
# Plesk variant carries the same policy with the wrapper, certificate, document
# root, and logging removed (Plesk supplies those), the real Plesk document root
# in its <Directory> block, and the transitional proxies for the pre-/api/ paths.
#
# This file remains the reference for a plain Apache host with no control panel.

<VirtualHost *:80>
    ServerName monitor.pinkcrab.co.uk

    # The admin session cookie is marked Secure, so it is never sent over port
    # 80 — but the login form must not be reachable in clear either.
    Redirect permanent / https://monitor.pinkcrab.co.uk/
</VirtualHost>

<VirtualHost *:443>
    ServerName monitor.pinkcrab.co.uk
    DocumentRoot /var/www/monitor-ui

    SSLEngine on
    # Cloudflare Origin Certificate (SSL/TLS -> Origin Server -> Create Certificate).
    # Trusted by Cloudflare in Full (strict) mode; browsers reaching the origin
    # directly will not trust it, which is expected and harmless.
    SSLCertificateFile    /etc/ssl/cloudflare/monitor.pinkcrab.co.uk.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/monitor.pinkcrab.co.uk.key

    # ---- API ---------------------------------------------------------------
    # Only /api/ is proxied. Proxied paths are resolved before the filesystem is
    # consulted, so they never reach DocumentRoot or the SPA fallback below.
    #
    # ProxyRequests Off disables *forward* proxying. Leaving it on would make
    # this server an open relay; it is unrelated to the reverse proxying wanted
    # here, and off is the correct value.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # The daemon binds loopback only, so it cannot see the real client address
    # or know the scheme. It uses these for rate-limit keys and deprecation logs.
    RequestHeader set X-Forwarded-Proto "https"

    # POST /api/alerts/channels/{id}/test performs a synchronous SMTP exchange
    # bounded at 30s server-side. Keep the proxy timeout comfortably above it so
    # a slow mail server surfaces the real error rather than a proxy 504.
    ProxyTimeout 45

    # ---- Admin UI ----------------------------------------------------------
    <Directory /var/www/monitor-ui>
        Require all granted
        Options -Indexes -ExecCGI
        AllowOverride None

        # Client-side routing: /alerts and /sites/xyz are React routes with no
        # file behind them, so an unmatched path renders the app shell.
        #
        # Scoped to this <Directory> ON PURPOSE. At vhost level it would also
        # catch mistyped API paths, returning the HTML shell with a 200 instead
        # of a JSON 404 — which is painful to diagnose from the client side.
        FallbackResource /index.html
    </Directory>

    # ---- Caching -----------------------------------------------------------
    # Default to no-cache, then carve out the one thing that is safe to cache
    # forever. Ordering matters: LocationMatch is evaluated after the vhost-level
    # directive, so the specific rules below win.
    #
    # The default has to be no-cache rather than a rule matching only
    # "^/(index\.html)?$", because LocationMatch tests the REQUEST url, not the
    # file FallbackResource ends up serving. A deep link such as /alerts returns
    # index.html but never matches that pattern, so it would be served with no
    # cache directive at all and could pin a browser to a previous build.
    Header always set Cache-Control "no-cache, must-revalidate"

    # Vite content-hashes asset filenames, so a given URL's bytes never change.
    # A new build produces new filenames, so this can be cached indefinitely.
    <LocationMatch "^/assets/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # API responses are live monitoring state; never let a cache serve them.
    # no-store rather than no-cache: authenticated responses should not be
    # written to disk by an intermediary at all.
    <LocationMatch "^/api/">
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # ---- Security headers --------------------------------------------------
    # The UI loads no external resources at all — no CDN, no web fonts, no
    # analytics — so everything can be locked to 'self'.
    #
    # 'unsafe-inline' appears for style only. React's style={{...}} prop sets
    # inline style attributes, which CSP governs via style-src-attr (falling
    # back to style-src). Script stays strict, which is where it matters:
    # the build emits no inline <script> at all.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    # frame-ancestors above covers modern browsers; this covers the rest.
    Header always set X-Frame-Options "DENY"

    # HSTS. This is a commitment: for the next year browsers will refuse plain
    # HTTP for this hostname. That is correct for an admin panel that is already
    # HTTPS-only. Deliberately WITHOUT includeSubDomains, so it cannot affect
    # other pinkcrab.co.uk hosts. To back out, serve max-age=0 and wait for
    # existing visitors' entries to lapse.
    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/monitor-error.log
    CustomLog ${APACHE_LOG_DIR}/monitor-access.log combined
</VirtualHost>
